<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Press a button and take home a surprise photo by Gaurang Alat.">
  <meta name="author" content="Gaurang Alat">
  <title>Mini print · Gaurang Alat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link href="/css/miniprint.css?v=20261101b" rel="stylesheet">
</head>

<body>
  <a class="back" href="/">← Home</a>

  <main class="stage">
    <div class="machine">
      <div class="shell">
        <span class="screw tl" aria-hidden="true"></span>
        <span class="screw tr" aria-hidden="true"></span>
        <span class="screw bl" aria-hidden="true"></span>
        <span class="screw br" aria-hidden="true"></span>

        <div class="sign">
          <h1>
            <span>Mini print</span>
            <span>Vending machine</span>
          </h1>

          <div class="art" aria-hidden="true">
            <svg class="herb" viewBox="0 0 80 90">
              <g fill="none" stroke="#2c7a34" stroke-width="1.7" stroke-linecap="round">
                <path d="M38 86 C36 62 40 44 34 22"/>
                <path d="M40 68 C26 60 16 54 12 42"/>
                <path d="M36 56 C52 48 64 46 70 32"/>
              </g>
              <g fill="#3e9a46">
                <ellipse cx="24" cy="36" rx="8" ry="14" transform="rotate(-38 24 36)"/>
                <ellipse cx="46" cy="26" rx="7.5" ry="13" transform="rotate(22 46 26)"/>
                <ellipse cx="20" cy="52" rx="7" ry="12" transform="rotate(-18 20 52)"/>
                <ellipse cx="58" cy="42" rx="7" ry="11" transform="rotate(32 58 42)"/>
                <ellipse cx="33" cy="16" rx="6" ry="10" transform="rotate(-8 33 16)"/>
                <ellipse cx="48" cy="48" rx="6" ry="10" transform="rotate(8 48 48)"/>
              </g>
            </svg>

            <svg class="cocktail" viewBox="0 0 80 90">
              <line x1="50" y1="6" x2="34" y2="36" stroke="#e10600" stroke-width="3.2" stroke-linecap="round"/>
              <line x1="50" y1="6" x2="34" y2="36" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="3 4"/>
              <circle cx="54" cy="11" r="8" fill="#f09a1a"/>
              <circle cx="54" cy="11" r="4.5" fill="none" stroke="#fff" stroke-width="1.4"/>
              <path d="M18 38 H62 L46 60 H34 Z" fill="#fffdf8" stroke="#1a1a1a" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M24 42 H56 L46 56 H34 Z" fill="#e23b45"/>
              <path d="M40 60 V74" stroke="#1a1a1a" stroke-width="1.6"/>
              <ellipse cx="40" cy="78" rx="14" ry="3.2" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
            </svg>

            <svg class="lemon" viewBox="0 0 80 90">
              <path d="M16 46 C16 28 32 16 48 20 C66 26 72 46 60 62 C48 78 22 70 16 46 Z" fill="#f5d23a"/>
              <path d="M60 38 C72 34 78 44 72 54 C66 62 58 54 58 46 Z" fill="#e8b820"/>
              <g fill="#e2b01e">
                <circle cx="32" cy="40" r="1.3"/>
                <circle cx="40" cy="48" r="1.3"/>
                <circle cx="34" cy="56" r="1.1"/>
                <circle cx="48" cy="42" r="1.1"/>
                <circle cx="46" cy="56" r="1.2"/>
                <circle cx="38" cy="36" r="1"/>
                <circle cx="50" cy="50" r="1"/>
              </g>
            </svg>

            <svg class="rocks" viewBox="0 0 80 90">
              <path d="M22 30 H58 L53 74 H27 Z" fill="#fffdf8" stroke="#1a1a1a" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M24 48 H56 L53 72 H27 Z" fill="#e23b3b"/>
              <path d="M24.5 48 H55.5" stroke="#f6c2b4" stroke-width="2"/>
              <path d="M30 26 C42 16 56 28 50 40 C40 36 32 36 30 26 Z" fill="#f28a22" stroke="#1a1a1a" stroke-width="1.3"/>
              <path d="M36 24 C42 30 46 32 50 38" fill="none" stroke="#f8d7a4" stroke-width="1.3"/>
            </svg>

            <svg class="bee" viewBox="0 0 80 90">
              <ellipse cx="26" cy="40" rx="13" ry="7" fill="#f7fbff" stroke="#1a1a1a" stroke-width="1.3" transform="rotate(-22 26 40)"/>
              <ellipse cx="54" cy="38" rx="13" ry="7" fill="#f7fbff" stroke="#1a1a1a" stroke-width="1.3" transform="rotate(20 54 38)"/>
              <ellipse cx="40" cy="54" rx="15" ry="20" fill="#f0c429" stroke="#1a1a1a" stroke-width="1.5"/>
              <path d="M27 46 H53 M29 54 H51 M32 62 H48" stroke="#1a1a1a" stroke-width="3.2" stroke-linecap="round"/>
              <circle cx="40" cy="32" r="7" fill="#1a1a1a"/>
              <path d="M34 28 C30 18 24 16 22 12" fill="none" stroke="#1a1a1a" stroke-width="1.3" stroke-linecap="round"/>
              <path d="M46 28 C50 18 56 16 58 12" fill="none" stroke="#1a1a1a" stroke-width="1.3" stroke-linecap="round"/>
              <circle cx="22" cy="11" r="1.5" fill="#1a1a1a"/>
              <circle cx="58" cy="11" r="1.5" fill="#1a1a1a"/>
            </svg>

            <svg class="berries" viewBox="0 0 80 90">
              <g fill="#d41420" stroke="#8d1218" stroke-width="0.7">
                <circle cx="28" cy="40" r="10"/>
                <circle cx="46" cy="32" r="10"/>
                <circle cx="58" cy="46" r="9"/>
                <circle cx="32" cy="56" r="10"/>
                <circle cx="50" cy="54" r="9"/>
                <circle cx="40" cy="44" r="8"/>
              </g>
              <g fill="#fff" opacity="0.35">
                <circle cx="25" cy="37" r="1.6"/>
                <circle cx="43" cy="29" r="1.6"/>
                <circle cx="55" cy="43" r="1.4"/>
                <circle cx="30" cy="52" r="1.5"/>
                <circle cx="47" cy="50" r="1.4"/>
              </g>
              <ellipse cx="36" cy="24" rx="6" ry="3.2" fill="#2f7d34" transform="rotate(-28 36 24)"/>
              <ellipse cx="50" cy="22" rx="6" ry="3.2" fill="#2f7d34" transform="rotate(24 50 22)"/>
              <path d="M42 28 C44 20 50 16 56 14" fill="none" stroke="#2f7d34" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>

          <p class="deal">4 quarters = 1 surprise print</p>

          <div class="brand">
            <svg class="badge" viewBox="0 0 96 68" aria-hidden="true">
              <rect x="3" y="3" width="90" height="62" rx="12" fill="#fffdf8" stroke="#1a1a1a" stroke-width="2"/>
              <rect x="8" y="8" width="80" height="52" rx="8" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
              <circle cx="16" cy="16" r="1.6" fill="#1a1a1a"/>
              <circle cx="80" cy="16" r="1.6" fill="#1a1a1a"/>
              <circle cx="16" cy="52" r="1.6" fill="#1a1a1a"/>
              <circle cx="80" cy="52" r="1.6" fill="#1a1a1a"/>
              <text x="48" y="30" text-anchor="middle">INDIAN</text>
              <text x="48" y="46" text-anchor="middle">PRINTS</text>
            </svg>
            <span class="brand-x" aria-hidden="true">×</span>
            <span class="rosemary">Rosemary's</span>
          </div>
        </div>

        <div class="rail" role="group" aria-label="Press a button for a surprise print">
          <button type="button" class="vend" data-slot="left" aria-label="Dispense a surprise print, left"></button>
          <button type="button" class="vend" data-slot="center" aria-label="Dispense a surprise print, center"></button>
          <button type="button" class="vend" data-slot="right" aria-label="Dispense a surprise print, right"></button>
        </div>
        <div class="slot" aria-hidden="true"></div>
      </div>

      <div class="stack" id="stack" role="region" aria-label="Dispensed prints"></div>
      <p class="sr-only" id="vend-status" aria-live="polite"></p>
    </div>
  </main>

  <dialog id="print-modal" closedby="any">
    <img id="print-modal-img" alt="">
    <div class="print-actions">
      <a id="print-download" href="" download>Download</a>
      <button type="button" id="print-close">Close</button>
    </div>
  </dialog>

  <script src="/js/miniprint.js?v=20261101b"></script>
</body>

</html>
